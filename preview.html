<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>لقطات شاشة نافع — 1080×1920</title>
<style>
  body { font-family: "Segoe UI", Tahoma, sans-serif; background: #0f1720; color: #e8eef5; margin: 0; padding: 24px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p.note { color: #9fb3c8; font-size: 14px; margin: 0 0 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
  figure { margin: 0; background: #16202b; border-radius: 14px; padding: 12px; }
  img { width: 100%; border-radius: 10px; display: block; }
  figcaption { margin-top: 8px; font-size: 13px; color: #cfe3ff; text-align: center; }
</style>
</head>
<body>
  <h1>لقطات التطبيق (1080×1920)</h1>
  <p>مقبولة في Google Play (الحد الأقصى 2:1). اختر ٨ كحد أقصى للرفع.</p>
  <div class="grid">
    <figure><img src="01_home.png" alt="الرئيسية"><figcaption>٠١ — الرئيسية</figcaption></figure>
    <figure><img src="02_quran.png" alt="المصحف"><figcaption>٠٢ — المصحف</figcaption></figure>
    <figure><img src="03_ayah.png" alt="آية ورواية"><figcaption>٠٣ — آية ورواية</figcaption></figure>
    <figure><img src="04_message.png" alt="رسالة"><figcaption>٠٤ — رسالة اليوم</figcaption></figure>
    <figure><img src="05_books_categories.png" alt="المكتبة"><figcaption>٠٥ — مكتبة الكتب</figcaption></figure>
    <figure><img src="06_books_list.png" alt="قائمة كتب"><figcaption>٠٦ — كتب الفئة</figcaption></figure>
    <figure><img src="07_quiz.png" alt="المسابقات"><figcaption>٠٧ — المسابقات</figcaption></figure>
    <figure><img src="08_khatma.png" alt="الختمة"><figcaption>٠٨ — الختمة</figcaption></figure>
    <figure><img src="09_khatma_detail.png" alt="أجزاء الختمة"><figcaption>٠٩ — أجزاء الختمة</figcaption></figure>
    <figure><img src="10_today.png" alt="اليوم والمناسبات"><figcaption>١٠ — اليوم والمناسبات</figcaption></figure>
    <figure><img src="11_profile.png" alt="الملف الشخصي"><figcaption>١١ — الملف الشخصي</figcaption></figure>
  </div>
</body>
</html>
